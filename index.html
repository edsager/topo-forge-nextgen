<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Topo Forge NextGen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #f0f0f0; display: flex; flex-direction: column; height: 100vh; }
    #toolbar { background: #2d2d2d; padding: 10px 20px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #444; }
    .toolbar-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    input, select, button { background: #3d3d3d; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; }
    button { background: #007acc; cursor: pointer; font-weight: bold; }
    button:hover { background: #0098ff; }
    button:disabled { background: #555; cursor: not-allowed; }
    #workspace { display: flex; flex: 1; overflow: hidden; }
    #map-view, #three-view { flex: 1; position: relative; }
    #three-view { border-left: 2px solid #444; }
    
    /* Custom Filament Color Palette */
    .color-picker-group { display: flex; align-items: center; gap: 8px; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; background: #222; }
    .color-picker-group label { font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
    input[type="color"] { padding: 0; margin: 0; border: none; width: 24px; height: 24px; cursor: pointer; background: transparent; }
    
    .status { margin-left: auto; font-style: italic; color: #aaa; }
  </style>
</head>
<body>
  <div id="toolbar">
    <div class="toolbar-row">
      <strong style="font-size: 1.2em; margin-right: 15px;">Topo Forge</strong>
      <input type="text" id="search-input" placeholder="Search Map..." />
      <button id="search-btn">Find</button>
      
      <select id="map-layer-select">
        <option value="satellite">View: High-Res Satellite</option>
        <option value="osm">View: Streets & Labels</option>
      </select>

      <label>Z-Scale: <input type="range" id="z-exaggeration" min="0.5" max="3" step="0.1" value="1.5"/> <span id="z-val">1.5x</span></label>
      
      <button id="preview-roads-btn" style="background: #e67e22;">Preview Roads on Map</button>
    </div>
    
    <div class="toolbar-row">
      <label>Total Width (mm): <input type="number" id="total-width-mm" value="275" style="width: 60px;"/></label>
      <label>Cols (X): <input type="number" id="grid-cols" value="6" style="width: 40px;"/></label>
      <label>Rows (Y): <input type="number" id="grid-rows" value="6" style="width: 40px;"/></label>
      <label>Nozzle: 
        <select id="nozzle-size">
          <option value="0.2">0.2mm</option>
          <option value="0.4" selected>0.4mm</option>
          <option value="0.6">0.6mm</option>
        </select>
      </label>
      <span style="font-size: 0.9em; color: #aaa;">Layer: <span id="layer-height-val">0.20</span>mm</span>
      
      <label>Water Drop:
        <select id="water-drop-layers">
          <option value="0">None</option>
          <option value="1" selected>1 Layer</option>
          <option value="2">2 Layers</option>
          <option value="3">3 Layers</option>
        </select>
      </label>
    </div>

    <div class="toolbar-row">
      <!-- The 7 Color Filament Palette -->
      <div class="color-picker-group">
        <label>Water <input type="color" id="col-water" value="#1E90FF"></label>
        <label>Dirt <input type="color" id="col-dirt" value="#8B4513"></label>
        <label>Forest <input type="color" id="col-forest" value="#228B22"></label>
        <label>Rock <input type="color" id="col-rock" value="#808080"></label>
        <label>Snow <input type="color" id="col-snow" value="#FFFFFF"></label>
        <label>Roads <input type="color" id="col-roads" value="#2F4F4F"></label>
        <label>Bldgs <input type="color" id="col-bldgs" value="#D3D3D3"></label>
      </div>

      <label><input type="checkbox" id="toggle-bathymetry" /> Enable Bathymetry</label>
      <label><input type="checkbox" id="include-roads" checked /> Include Major Roads</label>
      <button id="load-gpx-btn">Load Trails (.gpx)</button>
      <span id="gpx-status" style="display:none; color: #4CAF50; font-size: 0.9em;"></span>
      
      <button id="generate-btn" disabled>Generate</button>
      <button id="export-btn" disabled style="background: #ff6600;">Export OBJ</button>
      
      <span id="status-text" class="status">Waiting for area selection...</span>
    </div>
  </div>
  
  <div id="workspace">
    <div id="map-view"></div>
    <div id="three-view"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
